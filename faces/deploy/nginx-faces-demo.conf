# nginx site for the face watchlist demo. setup_droplet.sh replaces FACES_DOMAIN, installs it as
# /etc/nginx/sites-available/faces-demo, then certbot --nginx adds HTTPS (same as the other sites).
server {
    listen 80;
    server_name FACES_DOMAIN;
    client_max_body_size 200M;        # phone photos (2-5 MB) and videos; nginx's default 1 MB refuses even a photo

    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # MJPEG live view must stream, not buffer
        proxy_request_buffering off;  # uploads go straight to the app (its progress bar shows the real upload)
        proxy_read_timeout 3600s;     # live view stays open for a long time
    }
}
