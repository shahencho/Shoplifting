# nginx site for the fire demo. setup_droplet.sh replaces FIRE_DOMAIN, installs it as
# /etc/nginx/sites-available/fire-demo, then certbot --nginx adds HTTPS (same as the other sites).
server {
    listen 80;
    server_name FIRE_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # MJPEG live view must stream, not buffer
        proxy_read_timeout 3600s;     # live view stays open for a long time
    }
}
