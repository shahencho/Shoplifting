# Fire module defaults (docs/FIRE_MODULE_PLAN_3.md §4 and §7). Not shown in the UI.

model:
  weights: fire/models/best_nano_111.pt   # fetched by fire/models/download.py
  imgsz: 640
  device: cpu

detections:
  fire:  {enabled: true, conf: 0.35}
  smoke: {enabled: true, conf: 0.35}

temporal: {window_s: 3, min_ratio: 0.8, iou: 0.3, checks_per_s: 5}   # frame skip derived from stream FPS

cooldown: {after_alert_s: 60, alert_scope: camera, allow_upgrade: true, recheck_every_s: 15,
           after_dismissed_s: 60, dismissed_scope: area}

verify:   {model: null, frames: 5, timeout_s: 15, on_timeout: uncertain}   # model chosen in step 3

alerts:   {language: hy, instant_precheck_message: false, send_dismissed: false, send_uncertain: true,
           offline_notice_after_s: 120}

evidence: {clip_before_s: 5, clip_after_s: 3, freeze_at: trigger, retention_days: 14}

stream:
  prefer_substream: true
  max_height: 720          # YouTube / HLS: pick a stream no taller than this
  buffer_s: 10             # ring buffer for evidence clips
  buffer_fps: 10           # frames per second kept in the ring buffer (JPEG)
  max_lag_s: 6             # live: drop the oldest checks if detection falls more than this behind
  reconnect_backoff_s: [1, 2, 5, 10]
