<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0B0D10;--bar:#0E1115;--card:#13161B;--card2:#1A1E24;--card3:#232830;--ink:#ECEEF1;--ink2:#A3A9B3;
  --muted:#7C838E;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--accent:#FF6B2C;--accent-ink:#FF8A5B;
  --ok:#3DD68C;--amber:#FFB02E;--blue:#8DB8FF;--bad:#F26B6B;--grey:#A3A9B3;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#0B0D10,#11151B) fixed;color:var(--ink);font:15px/1.45 var(--sans);min-height:100vh}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a,button.link{color:var(--ink2);background:none;border:0;font:inherit;cursor:pointer;padding:0;text-decoration:none}

/* header */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:0 20px;height:64px;
  background:rgba(14,17,21,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#0B0D10;
  box-shadow:0 0 24px rgba(255,107,44,.35)}
.vsep{width:1px;height:24px;background:var(--line2)}
.camhdr{display:flex;flex-direction:column;line-height:1.2}.camhdr b{font-size:14px;font-weight:600}
.camhdr span{font:12px var(--mono);color:var(--muted)}
header .sp{flex:1}
nav{display:flex;gap:4px}
nav a,nav button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:14px}
nav a:hover,nav button:hover{color:var(--ink);background:rgba(255,255,255,.05)}nav a.on{color:var(--ink);background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.05);color:var(--ink2);white-space:nowrap}
.pill.ok{background:rgba(61,214,140,.1);color:var(--ok)}.pill.bad{background:rgba(242,107,107,.12);color:var(--bad)}
.pill.wait{background:rgba(255,176,46,.12);color:var(--amber)}
.pill.demo{background:rgba(141,184,255,.12);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

main{max-width:1400px;margin:0 auto;padding:20px}
.wiz{max-width:1000px;margin:0 auto;padding-top:16px}

/* wizard */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.steps{display:flex;align-items:center;gap:10px;margin:0 0 22px;padding:0;list-style:none;font-size:14px;color:var(--muted);overflow-x:auto}
.steps li{display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500}
.steps li+li::before{content:"";width:28px;height:1px;background:var(--line2);margin-right:2px}
.steps a{display:flex;align-items:center;gap:8px;color:inherit;padding:6px 8px;margin:-6px -8px;border-radius:8px}.steps a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.steps .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);font:12px var(--mono)}
.steps .on{color:var(--ink)}.steps .on .n{background:var(--accent);border-color:var(--accent);color:#0B0D10;font-weight:600}
.steps .done{color:var(--ink2)}.steps .done .n{background:var(--card3);border-color:transparent;color:var(--ink)}
h1{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}.sub{color:var(--ink2);margin:0 0 22px}
h2{font-size:15px;margin:0}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px}
input,select{width:100%;font:inherit;height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:2px solid rgba(255,107,44,.6);outline-offset:0;border-color:transparent}
input::placeholder{color:#5E656F}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.camgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.or{margin:18px 0 0;color:var(--muted);font-size:13px}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:0 0 18px;border-radius:10px;
  background:rgba(141,184,255,.08);border:1px solid rgba(141,184,255,.25);color:var(--ink2);font-size:14px}
.note svg{color:var(--blue);margin-top:2px}.note b{color:var(--ink)}
.hints{margin:14px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.hints li{display:flex;gap:8px;margin-top:6px}.hints li::before{content:"•";color:var(--line2)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button.b{font:inherit;font-weight:600;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:transparent;
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.b:hover{background:rgba(255,255,255,.05)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0B0D10}button.primary:hover{background:var(--accent);filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;margin-top:12px}.msg.bad{color:var(--bad)}.msg.good{color:var(--ok)}
.preview{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background-color:#07080A;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:40px 40px;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.det{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.det:last-of-type{border:0}.det .txt{flex:1}.det small{display:block;color:var(--muted);font-size:13px}
.det .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--card2);color:var(--ink2)}
.det .ic.fire{background:rgba(255,107,44,.14);color:var(--accent)}
.det.soon{opacity:.55}.det.soon .lock{color:var(--muted)}
.soonhead{margin:22px 0 4px;font:600 12px var(--mono);letter-spacing:.14em;color:var(--muted)}
.sw{position:relative;width:52px;height:30px;flex:none;margin:0}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#2A3140;border-radius:15px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span:before{transform:translateX(22px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.qr{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.qr img{width:190px;height:190px;background:#fff;border-radius:12px;padding:8px}
.qr a{color:var(--accent-ink);word-break:break-all}

/* live */
.banner{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:14px;background:var(--accent);color:#0B0D10;margin-bottom:18px;
  animation:bpulse 2s ease-in-out infinite;transition:opacity .4s,filter .4s}
.banner.amber{background:var(--amber);animation-name:bpulseA}
@keyframes bpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,44,.5),0 10px 40px -12px rgba(255,107,44,.6)}50%{box-shadow:0 0 0 9px rgba(255,107,44,0),0 10px 56px -8px rgba(255,107,44,.85)}}
@keyframes bpulseA{0%,100%{box-shadow:0 0 0 0 rgba(255,176,46,.5)}50%{box-shadow:0 0 0 9px rgba(255,176,46,0)}}
.banner.ack{animation:none;opacity:.6;filter:saturate(.5)}
.banner .bic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:rgba(11,13,16,.14);flex:none}
.banner .bic svg{width:24px;height:24px}
.banner .btxt{flex:1;min-width:0}.banner .bt{font-weight:700;font-size:18px;letter-spacing:-.01em}
.banner .bs{font-size:14px;opacity:.8;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner .bb{display:flex;gap:10px;flex:none}
.banner button{height:48px;padding:0 18px;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.banner .dark{background:#0B0D10;color:#ECEEF1;border:0}.banner .ghost{background:transparent;color:#0B0D10;border:2px solid rgba(11,13,16,.35)}

.live{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px}
.video{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);
  box-shadow:0 20px 60px -24px rgba(0,0,0,.9)}
.video.bad{border-color:transparent;box-shadow:inset 0 0 0 2px rgba(242,107,107,.7)}
.video img{width:100%;height:100%;object-fit:contain;display:block}
.ov{position:absolute;display:flex;gap:8px}.ov.tl{top:14px;left:14px}.ov.tr{top:14px;right:14px}
.badge{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:7px;background:rgba(11,13,16,.7);
  backdrop-filter:blur(4px);font-size:12px;color:var(--ink2)}
.badge.live{font-weight:700;letter-spacing:.1em;color:var(--ink)}.badge.live .dot{color:var(--ok)}
.badge.off{color:var(--bad);font-weight:700;letter-spacing:.1em}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(11,13,16,.88);padding:20px}
.ph .big{font-size:22px;font-weight:600;margin:10px 0 4px}.ph .small{color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:8px;justify-content:center}
.ph .circ{display:grid;place-items:center;width:56px;height:56px;margin:0 auto;border-radius:50%;background:rgba(255,255,255,.06)}
.ph.bad .circ{background:rgba(242,107,107,.14);color:var(--bad)}.ph.bad .big{color:#F79B9B}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 10px}
.rowhead h2{font-size:14px;color:var(--ink2);font-weight:600}
.upd{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted)}
.upd .dot{width:6px;height:6px;color:var(--ok);background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
.stat .l{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.stat .v{font:500 22px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.stat .v small{font-size:13px;color:var(--muted);margin-left:3px}.stat .v.txt{font-size:15px;padding-top:5px}
.tr{font-family:var(--mono)}.tr.good{color:var(--ok)}.tr.worse{color:var(--amber)}
.watch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.chipw{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--card2);font-weight:500}
.chipw svg{width:15px;height:15px}.chipw.fire svg{color:var(--accent)}

.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.counters div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.counters span{font-size:12px;color:var(--muted)}.counters b{display:block;font:500 28px var(--mono);font-variant-numeric:tabular-nums}
.counters .al b{color:var(--accent)}
.events{position:relative;display:flex;flex-direction:column;gap:12px}
.events.rail::before{content:"";position:absolute;left:7px;top:18px;bottom:18px;width:2px;border-radius:2px;background:var(--line2)}
.ev{position:relative;margin-left:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;
  transition:transform .18s,box-shadow .18s,border-color .18s}
.ev:hover{transform:translateY(-3px);box-shadow:0 14px 34px -12px rgba(0,0,0,.85);border-color:var(--line2)}
.ev .rd{position:absolute;left:-25px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--grey);box-shadow:0 0 0 4px #0F1318}
.ev.checking .rd{background:var(--blue)}.ev.confirmed .rd{background:var(--accent)}.ev.possible .rd,.ev.unverified .rd{background:var(--amber)}
.ev .top{display:flex;gap:12px}
.ev .thumb{width:108px;height:61px;border-radius:8px;object-fit:cover;background:#07080A;flex:none;cursor:zoom-in;border:1px solid var(--line)}
.ev .hd{min-width:0;flex:1}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;margin-right:6px}
.tag.checking{background:rgba(141,184,255,.14);color:var(--blue);animation:blink 1.4s ease-in-out infinite}
.tag.confirmed{background:rgba(255,107,44,.15);color:var(--accent-ink)}
.tag.possible,.tag.unverified{background:rgba(255,176,46,.14);color:var(--amber)}
.tag.dismissed{background:rgba(163,169,179,.1);color:var(--ink2)}
@keyframes blink{50%{opacity:.45}}
.ev .meta{font:12px var(--mono);color:var(--muted)}.ev .note{font-size:13px;color:var(--ink2);margin-top:4px}
.reason{margin-top:10px;padding:9px 12px;border-radius:9px;background:rgba(255,255,255,.03)}
.reason .rl{display:flex;align-items:center;gap:5px;font:10px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.reason .rl svg{width:12px;height:12px;color:var(--accent)}
.reason p{margin:0;font-size:15px;line-height:1.4;color:var(--ink)}
.ev .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ev .acts button{font:inherit;font-size:12px;font-weight:500;height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.ev .acts button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.ev .acts button.on{background:var(--ink);color:#0B0D10;border-color:var(--ink)}
.ev .acts svg{width:14px;height:14px}
.ev video{width:100%;border-radius:8px;margin-top:10px;display:block}
.empty{text-align:center;padding:34px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.empty .circ{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 12px;border-radius:50%;background:rgba(61,214,140,.1);color:var(--ok)}
.empty b{display:block;font-size:17px}.empty span{color:var(--ink2)}

#toasts{position:fixed;top:76px;left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:#1C2128;border:1px solid var(--line2);
  box-shadow:0 16px 40px -12px rgba(0,0,0,.8);font-size:14px;font-weight:500;animation:tin .22s ease-out;transition:opacity .3s}
.toast svg{color:var(--ok)}.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
dialog{border:0;padding:0;background:transparent;color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.85)}
#zoom img{max-width:95vw;max-height:90vh;border-radius:10px;display:block}
.clipbox{width:min(960px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.cliphead{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line)}
.cliphead .t{flex:1}.cliphead span{display:block;font:12px var(--mono);color:var(--muted)}
.cliphead button{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.cliphead button:hover{background:rgba(255,255,255,.06)}
.clipbox video{width:100%;display:block;background:#000;max-height:75vh}

@media (max-width:1000px){.live{grid-template-columns:1fr}}
@media (max-width:820px){.camgrid{grid-template-columns:1fr}.camhdr,.vsep{display:none}}
@media (max-width:640px){
  main{padding:14px 16px}header{padding:0 12px;gap:10px}.brand b,nav .t{display:none}
  .grid2{grid-template-columns:1fr}h1{font-size:24px}.card{padding:18px}
  .stats{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}.stat{min-width:140px;scroll-snap-align:start}
  .banner{flex-wrap:wrap}.banner .bb{width:100%}.banner button{flex:1;height:56px}
  .btns button.b{flex:1;height:56px}.ov.tl .dim{display:none}.pill .long{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const $ = s => document.querySelector(s);
const api = async (url, body) => {
  const r = await fetch(url, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (r.status === 401){ location.reload(); throw new Error("login"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (name, cls = "i") => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
let S = null, screen = null, timer = null, lastOk = 0, prev = {};

function toast(text){
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = icon("check") + `<span>${esc(text)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 300); }, 2400);
}

// acknowledge is stored on the server (stops reminders for the ongoing fire); isAcked reads it from the event
const isAcked = e => !!(e && e.acked);

const STATE = {checking:["Checking…","AI is looking at it"], confirmed:["Fire confirmed",""], possible:["Possible fire",""],
               dismissed:["Dismissed","false alarm, no alert sent"], unverified:["Alert (not verified)",""]};
const CAMSTATE = {ok:["ok","Monitoring"], connecting:["wait","Connecting…"], offline:["bad","Camera offline"],
                  not_configured:["", "No camera"], ended:["", "Video ended"], stopped:["", "Stopped"]};
const ALERTS = new Set(["confirmed","possible","unverified"]);
const evTime = e => (e.wall_time || "").slice(11) || `t=${e.t.toFixed(0)}s`;

async function refresh(){
  try { S = await api("/api/state"); lastOk = Date.now(); } catch(e){ return; }
  const st = S.status, [cls, txt] = CAMSTATE[st.state] || ["", st.state];
  $("#hdrstate").className = "pill " + cls;
  $("#hdrstate").innerHTML = `<span class="dot ${cls === "ok" ? "pulse" : ""}"></span>${txt}`;
  const c = S.camera || {};
  $("#hdrcam").textContent = st.camera && st.state !== "not_configured" ? st.camera : "";
  $("#hdrsrc").textContent = c.ip ? `${c.brand || ""} · ${c.ip}` : "";
  $("#hdrdemo").hidden = !st.demo;
  if (screen === "live") drawLive();
  if (screen === "alerts") drawLinked();
}

function show(name){
  screen = name;
  const app = $("#app");
  app.innerHTML = ""; app.appendChild($("#t-" + name).content.cloneNode(true));
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", (a.dataset.nav === "live") === (name === "live")));
  ({camera:initCamera, detections:initDetections, alerts:initAlerts, live:initLive})[name]();
}

function route(){
  const h = location.hash.slice(1);
  if (["camera","detections","alerts","live"].includes(h)) return show(h);
  location.hash = S && S.status.setup_done ? "live" : "camera";
}

// --- 1. camera ---
function camBody(){ return {name:$("#c-name").value, brand:$("#c-brand").value, ip:$("#c-ip").value, user:$("#c-user").value,
  password:$("#c-pass").value, channel:$("#c-ch").value, url:$("#c-url").value}; }
function initCamera(){
  const c = S.camera || {};
  $("#c-name").value = c.name || ""; $("#c-brand").value = c.brand || "hikvision"; $("#c-ip").value = c.ip || "";
  $("#c-user").value = c.user || ""; $("#c-ch").value = c.channel || "1"; $("#c-url").value = c.url || "";
  if (c.has_password) $("#c-pass").placeholder = "saved (leave empty to keep)";
  if (c.demo){ const note = () => $("#c-demo").hidden = $("#c-url").value.trim() !== c.url; note(); $("#c-url").oninput = note; }
  const msg = (t, ok) => { $("#c-msg").textContent = t; $("#c-msg").className = "msg " + (ok ? "good" : "bad"); };
  $("#c-test").onclick = async () => {
    $("#c-test").disabled = true; msg("Connecting to the camera…", true); $("#c-snap").hidden = true;
    $("#c-ph").hidden = false; $("#c-ph").innerHTML = `<span style="display:flex;gap:8px;align-items:center"><span class=spin></span>Connecting…</span>`;
    try { const r = await api("/api/camera/test", camBody()); msg(r.message, r.ok);
          if (r.image){ $("#c-snap").src = r.image; $("#c-snap").hidden = false; $("#c-ph").hidden = true; }
          else $("#c-ph").textContent = "No picture from the camera."; }
    catch(e){ msg(e.message, false); $("#c-ph").textContent = "No picture from the camera."; }
    $("#c-test").disabled = false;
  };
  $("#c-save").onclick = async () => {
    if (!$("#c-name").value.trim()) return msg("Give the camera a name", false);
    try { await api("/api/camera", camBody()); await refresh(); location.hash = S.status.setup_done ? "live" : "detections"; }
    catch(e){ msg(e.message, false); }
  };
}

// --- 2. detections ---
function initDetections(){
  $("#d-fire").checked = S.status.detections.fire; $("#d-smoke").checked = S.status.detections.smoke;
  for (const k of ["fire","smoke"]) $("#d-" + k).onchange = ev => api("/api/detections", {[k]: ev.target.checked});
  $("#d-next").onclick = () => location.hash = S.status.setup_done ? "live" : "alerts";
}

// --- 3. alerts ---
function drawLinked(){
  const t = S.telegram, el = $("#a-linked");
  if (!el) return;
  if (!t.enabled){ el.textContent = "Telegram bot is not configured on the server (TELEGRAM_BOT_TOKEN)."; el.className = "msg bad"; return; }
  el.textContent = t.chats.length ? "✓ Linked as " + t.chats.join(", ") : "Waiting for Start…";
  el.className = "msg " + (t.chats.length ? "good" : "");
}
function initAlerts(){
  const t = S.telegram;
  if (t.enabled && t.link){ $("#a-qr").src = "/api/telegram/qr.png"; $("#a-link").href = t.link; $("#a-link").textContent = t.link; }
  else $("#a-qr").hidden = true;
  drawLinked();
  const msg = (x, ok) => { $("#a-msg").textContent = x; $("#a-msg").className = "msg " + (ok ? "good" : "bad"); };
  $("#a-test").onclick = async () => { try { await api("/api/telegram/test", {}); msg("Test alert sent. Check your phone.", true); }
                                       catch(e){ msg(e.message, false); } };
  $("#a-done").onclick = async () => { await api("/api/setup_done", {}); await refresh(); location.hash = "live"; };
}

// --- 4. live + events ---
let imgOk = false;
function initLive(){
  const img = $("#l-img");
  imgOk = false;
  img.onload = () => { imgOk = true; drawVideoState(); };
  img.onerror = () => { imgOk = false; drawVideoState(); setTimeout(() => img.src = "/live.mjpg?" + Date.now(), 3000); };
  img.src = "/live.mjpg";
  drawLive();
}
function drawVideoState(){
  if (!$("#l-video") || !S) return;
  const st = S.status, off = st.state === "offline";
  $("#l-video").classList.toggle("bad", off);
  $("#l-badge").className = "badge " + (st.state === "ok" ? "live" : off ? "off" : "");
  $("#l-badge").innerHTML = st.state === "ok" ? `<span class="dot pulse"></span>LIVE` : off ? "OFFLINE" : esc((CAMSTATE[st.state] || ["", st.state])[1]);
  $("#l-cam").textContent = st.camera || "";
  $("#l-cam").hidden = !st.camera;
  const ph = $("#l-ph");
  ph.hidden = st.state === "ok" && imgOk;
  ph.classList.toggle("bad", off);
  if (off){
    $("#l-phic").innerHTML = icon("wifioff");
    $("#l-phbig").textContent = "Camera disconnected";
    $("#l-phsmall").innerHTML = `<span class=spin></span>Reconnecting…${st.offline_s ? ` offline ${st.offline_s} s` : ""}${st.reconnects ? ` · attempt ${st.reconnects}` : ""}`;
  } else if (st.state === "not_configured"){
    $("#l-phic").innerHTML = icon("cam"); $("#l-phbig").textContent = "No camera yet";
    $("#l-phsmall").innerHTML = `<a href="#camera" style="color:var(--accent-ink)">Open Settings to connect one</a>`;
  } else if (st.state === "ended" || st.state === "stopped"){
    $("#l-phic").innerHTML = icon("cam"); $("#l-phbig").textContent = CAMSTATE[st.state][1]; $("#l-phsmall").textContent = "";
  } else {
    $("#l-phic").innerHTML = `<span class=spin></span>`; $("#l-phbig").textContent = "Connecting…"; $("#l-phsmall").textContent = "";
  }
}

function trend(key, v, goodUp){
  const p = prev[key]; prev[key] = v;
  if (p === undefined || v === p || !v) return "";
  const up = v > p, good = up === goodUp;
  return `<span class="tr ${good ? "good" : "worse"}">${up ? "↑" : "↓"} ${Math.abs(v - p).toFixed(1)}</span>`;
}
function drawStats(){
  const st = S.status, live = st.state === "ok";
  const fps = live && st.fps ? Number(st.fps) : 0, det = live ? Number(st.detector_ms) : 0;
  const ai = st.qwen === "off" ? "off" : String(st.qwen).split("/").pop();
  const tiles = [
    ["Stream", fps ? fps.toFixed(1) : "—", "fps", trend("fps", fps, true)],
    ["Detector", det ? det.toFixed(1) : "—", "ms", trend("det", det, false)],
    ["Checks", Number(st.checks).toLocaleString("en-US"), "", ""],
    ["AI check", ai, "", st.qwen_calls ? `<span class=tr>${st.qwen_calls} calls</span>` : "", true],
    ["Reconnects", String(st.reconnects), "", ""],
  ];
  $("#l-stats").innerHTML = tiles.map(([l, v, u, tr, txt]) =>
    `<div class=stat><div class=l><span>${l}</span>${tr}</div><div class="v ${txt ? "txt" : ""}" title="${esc(v)}">${esc(v)}${u ? `<small>${u}</small>` : ""}</div></div>`).join("");
  const on = [["fire","flame","Fire"],["smoke","smoke","Smoke"]].filter(([k]) => st.detections[k]);
  $("#l-watch").innerHTML = `<span class=muted>Watching</span>` + (on.length
    ? on.map(([k, ic, n]) => `<span class="chipw ${k}">${icon(ic)}${n}</span>`).join("")
    : `<span style="color:var(--amber)">nothing: turn on Fire or Smoke in Settings</span>`);
}

function drawBanner(){
  const el = $("#l-banner");
  const e = S.events.find(x => ALERTS.has(x.state));
  const chats = S.telegram.chats.length;
  const sig = e ? JSON.stringify([e.n, e.state, e.kind, e.reason, (e.files || {}).clip, e.sent, isAcked(e), chats]) : "";
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  if (!e){ el.innerHTML = ""; return; }
  const ack = isAcked(e), conf = e.state === "confirmed", clip = (e.files || {}).clip;
  const head = conf ? (e.kind === "still" ? "FIRE STILL DETECTED" : "FIRE CONFIRMED")
             : e.state === "possible" ? "POSSIBLE FIRE" : "ALERT (NOT VERIFIED)";
  const sent = !e.sent.length ? "Sending alert…" : chats ? `Alert sent to ${chats} ${chats === 1 ? "person" : "people"}` : "Alert sent";
  const sub = ack ? "Acknowledged" : e.reason ? `“${e.reason}”` : (S.status.camera || "");
  el.innerHTML = `<div class="banner ${conf ? "" : "amber"} ${ack ? "ack" : ""}" role="alert">
    <span class=bic>${icon("alert")}</span>
    <div class=btxt><div class=bt>🔥 ${head} <span style="opacity:.5">•</span> ${esc(sent)} <span style="opacity:.5">•</span> <span class=mono>${esc(evTime(e))}</span></div>
      <div class=bs>${esc(sub)}</div></div>
    <div class=bb>
      <button class=dark data-bclip=${e.n} ${clip ? "" : "disabled"}>${icon("play")}${clip ? "View clip" : "Clip…"}</button>
      <button class=ghost data-ack=${e.n} ${ack ? "disabled" : ""}>${icon("check")}${ack ? "Acknowledged" : "Acknowledge"}</button>
    </div></div>`;
}

const openEv = new Set();
function drawLive(){
  if (!$("#l-events")) return;
  const st = S.status;
  drawVideoState(); drawStats(); drawBanner();
  $("#n-events").textContent = st.counters.events; $("#n-alerts").textContent = st.counters.alerts;
  $("#n-dismissed").textContent = st.counters.dismissed;
  const box = $("#l-events");
  const sig = JSON.stringify([S.events, [...openEv]]);
  if (box.dataset.sig === sig) return;          // unchanged: don't restart an open clip
  box.dataset.sig = sig;
  box.classList.toggle("rail", S.events.length > 1);
  if (!S.events.length){
    box.innerHTML = `<div class=empty><div class=circ>${icon("shield")}</div><b>No alerts today.</b><span>System monitoring normally.</span></div>`;
    return;
  }
  box.innerHTML = S.events.map(e => {
    let [title, note] = STATE[e.state] || [e.state, ""];
    if (e.state === "confirmed" && e.kind === "still") title = "Fire still detected";
    if (e.upgraded_t !== null && e.state === "confirmed") note = "upgraded from possible fire";
    if (e.state === "possible") note = e.verdict === "UNCERTAIN" ? "AI not sure, alert sent" : "not verified, alert sent";
    const f = e.files || {};
    return `<article class="ev ${e.state}"><span class=rd></span>
      <div class=top>
        ${f.snapshot ? `<img class=thumb src="/files/${esc(f.snapshot)}" alt="snapshot" data-zoom>` : `<div class=thumb></div>`}
        <div class=hd><span class="tag ${e.state}">${esc(title)}</span><span class=meta>${esc(e.box.cls)} · ${esc(evTime(e))}</span>
          ${note ? `<div class=note>${esc(note)}</div>` : ""}</div>
      </div>
      ${e.reason ? `<div class=reason><div class=rl>${icon("sparkles")}AI reasoning</div><p>“${esc(e.reason)}”</p></div>` : ""}
      ${f.clip || e.state !== "checking" ? `<div class=acts>
        ${f.clip ? `<button data-clip=${e.n}>${icon("play")}${openEv.has(e.n) ? "Hide clip" : "Clip"}</button>` : ""}
        ${e.state !== "checking" ? `<button data-fb=real data-n=${e.n} class="${e.feedback === "real" ? "on" : ""}">${icon("up")}Real</button>
        <button data-fb=false data-n=${e.n} class="${e.feedback === "false" ? "on" : ""}">${icon("down")}False alarm</button>` : ""}
      </div>` : ""}
      ${f.clip && openEv.has(e.n) ? `<video src="/files/${esc(f.clip)}" controls autoplay muted playsinline></video>` : ""}
    </article>`;
  }).join("");
}

function tick(){
  const c = $("#l-clock"); if (c) c.textContent = new Date().toLocaleTimeString("en-GB");
  const u = $("#l-upd");
  if (u && lastOk){ const s = Math.floor((Date.now() - lastOk) / 1000); u.textContent = s < 1 ? "Updated just now" : `Updated ${s}s ago`; }
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, img[data-zoom], dialog") || ev.target;
  if (t.dataset.clip){ const n = +t.dataset.clip; openEv.has(n) ? openEv.delete(n) : openEv.add(n); drawLive(); }
  if (t.dataset.fb){ const e = S.events.find(x => x.n === +t.dataset.n), v = e.feedback === t.dataset.fb ? "" : t.dataset.fb;
    await api(`/api/events/${t.dataset.n}/feedback`, {value: v}); await refresh();
    if (v) toast(v === "real" ? "Marked as real" : "Marked as false alarm"); }
  if (t.dataset.ack){
    try { await api(`/api/events/${t.dataset.ack}/ack`, {}); await refresh(); toast("Acknowledged: no more alerts for this fire"); }
    catch(err){ toast("Could not acknowledge: " + err.message); }
  }
  if (t.dataset.bclip){ const e = S.events.find(x => x.n === +t.dataset.bclip);
    if (e && e.files.clip){ $("#clipvid").src = "/files/" + e.files.clip; $("#clipmeta").textContent = `${S.status.camera || ""} · ${evTime(e)}`;
      $("#clipdlg").showModal(); $("#clipvid").play().catch(() => {}); } }
  if (t.dataset.zoom !== undefined && t.src){ $("#zoom img").src = t.src; $("#zoom").showModal(); }
  if (t.id === "zoom" || t.closest("#zoom")) $("#zoom").close();
  if (t.id === "clipclose" || ev.target.id === "clipdlg") $("#clipdlg").close();   // close button or backdrop, not the video
});
$("#clipdlg").addEventListener("close", () => { $("#clipvid").pause(); $("#clipvid").removeAttribute("src"); $("#clipvid").load(); });
$("#logout").onclick = async () => { await api("/api/logout", {}); location.reload(); };
addEventListener("hashchange", route);
(async () => { await refresh(); route(); timer = setInterval(refresh, 2000); setInterval(tick, 500); tick(); })();
</script></body></html>
