<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Watch login</title>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--line:rgba(11,11,11,.12);--accent:#d03b3b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--line:rgba(255,255,255,.12)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--ink2);font-size:14px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:18px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff}
#err{color:var(--accent);font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>
<form id=f><h1>🔥 Fire Watch</h1><p>Visual fire &amp; smoke warning</p>
<label for=u>User</label><input id=u autocomplete=username required>
<label for=p>Password</label><input id=p type=password autocomplete=current-password required>
<button>Log in</button><div id=err></div></form>
<script>
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({user: u.value, password: p.value})});
  if (r.ok) location.reload(); else document.getElementById("err").textContent = "Wrong user or password";
};
</script></body></html>
